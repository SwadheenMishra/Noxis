[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noxis"
version = "0.1.0"
description = "Local network security scanner: finds devices, identifies what they are, flags suspicious ones."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
noxis = "noxis.__main__:main"

[tool.setuptools]
packages = ["noxis"]
