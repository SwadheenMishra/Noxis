name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v

  # What a user gets from `pip install noxis`: build the package, install it
  # into a fresh virtual environment, and run it away from the source folder,
  # so a file missing from the package can't hide behind the repo.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the package
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install it into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/Scripts/python.exe" ]; then
            echo "VENV_BIN=$RUNNER_TEMP/venv/Scripts" >> "$GITHUB_ENV"
          else
            echo "VENV_BIN=$RUNNER_TEMP/venv/bin" >> "$GITHUB_ENV"
          fi
          "$RUNNER_TEMP/venv/"*/python -m pip install dist/*.whl
      - name: Run the installed command
        run: |
          mkdir "$RUNNER_TEMP/elsewhere" && cd "$RUNNER_TEMP/elsewhere"
          "$VENV_BIN/python" -c "import noxis; assert 'site-packages' in noxis.__file__, noxis.__file__; print(noxis.__file__)"
          "$VENV_BIN/noxis" --version
          for c in scan check sweep monitor honeypot trust forget known update-oui alerts mute push service; do
            "$VENV_BIN/noxis" $c --help > /dev/null
          done
      - name: Run the tests against the installed copy
        run: |
          cp -r tests "$RUNNER_TEMP/elsewhere/"
          cd "$RUNNER_TEMP/elsewhere"
          "$VENV_BIN/python" -m unittest discover -s tests -t .
